name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup JFrog Fly
        uses: jfrog/fly-action@v1

      - run: npm ci
      - run: npm run build

      - name: Build Docker image
        run: |
          docker build -t "${{ env.FLY_REGISTRY_SUBDOMAIN }}/docker/leaflet:${{ github.sha }}" .

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${{ env.FLY_REGISTRY_SUBDOMAIN }}/docker/leaflet:${{ github.sha }}"

      # - name: Publish to Fly npm registry
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   run: |
      #     echo "//${FLY_REGISTRY_SUBDOMAIN}/artifactory/api/npm/npm/:_authToken=${FLY_ACCESS_TOKEN}" >> ~/.npmrc
      #     npm publish
