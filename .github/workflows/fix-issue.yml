name: Fix Issue

on:
  issues:
    types: [opened]

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JFrog Fly
        uses: jfrog/fly-action@v1

      - run: npm ci

      - name: Run fix agent
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx flue run fix-issue --target node \
            --payload '{"issueNumber": ${{ github.event.issue.number }}}'
